[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hardware-copilot-conference"
version = "0.1.0"
description = "Evidence-gated multi-agent engineering conference runtime for the AI Hardware Copilot"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
hardware-copilot = "ai_hardware_copilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

